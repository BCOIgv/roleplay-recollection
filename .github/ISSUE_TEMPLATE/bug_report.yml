name: Bug report
description: Report behavior that differs from the documented contract.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove secrets, tokens, and real chat logs from logs and
        fixtures before submitting. Use synthetic data for reproductions.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the actual behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What the documented contract led you to expect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Synthetic data only; include the smallest script that shows the issue.
      render: js
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `VERSION` or the package.json version.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version and OS
      placeholder: v22.14.0, Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets and personal data.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
