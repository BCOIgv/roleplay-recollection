name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install development dependencies
        run: npm ci
      - name: Type declarations
        run: npm run check:types
      - name: Test
        run: npm test
      - name: Check
        run: npm run check
      - name: Demos
        run: |
          npm run demo:basic
          npm run demo
          npm run demo:solitude
          npm run demo:global
      - name: Release metadata
        run: npm run release:check
      - name: Package dry run
        run: npm pack --dry-run

      - name: Installed core and DSH consumer
        run: npm run verify:consumer
