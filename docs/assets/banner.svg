    <linearGradient id="bannerLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b86d" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e8b86d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bannerBg)"/>
  <rect width="1280" height="360" fill="url(#bannerGlow)"/>

  <g fill="none" stroke="#e8b86d" stroke-opacity="0.08" stroke-width="1">
