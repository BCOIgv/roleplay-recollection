    <circle cx="1120" cy="40" r="140"/>
  </g>

  <g fill="#e8b86d" opacity="0.32">
    <ellipse cx="1090" cy="250" rx="16" ry="7" transform="rotate(-28 1090 250)"/>
    <ellipse cx="1136" cy="286" rx="11" ry="5" transform="rotate(-16 1136 286)"/>
    <ellipse cx="1036" cy="300" rx="9" ry="4" transform="rotate(-40 1036 300)"/>
    <ellipse cx="1180" cy="196" rx="7" ry="3" transform="rotate(-24 1180 196)"/>
  </g>

  <g transform="translate(76,112)">
