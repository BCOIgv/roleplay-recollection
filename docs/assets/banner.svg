<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">朝花夕拾 · AI Roleplay Recollection</title>
  <desc id="bannerDesc">A dusk gradient banner with a crescent moon, falling petals, the title 朝花夕拾, and the descriptor AI 角色扮演回忆核心.</desc>
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1420"/>
      <stop offset="0.55" stop-color="#1b2234"/>
      <stop offset="1" stop-color="#2c1f2e"/>
    </linearGradient>
    <radialGradient id="bannerGlow" cx="18%" cy="38%" r="62%">
      <stop offset="0" stop-color="#e8b86d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e8b86d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bannerInk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8ecd4"/>
      <stop offset="1" stop-color="#e8b86d"/>
