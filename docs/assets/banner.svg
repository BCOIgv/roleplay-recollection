  <text x="258" y="208" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="19" letter-spacing="12" fill="#cdb892">AI ROLEPLAY RECOLLECTION</text>

  <rect x="258" y="238" width="360" height="1" fill="url(#bannerLine)"/>
  <text x="258" y="282" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif" font-size="24" fill="#aeb6c4">AI 角色扮演回忆核心</text>
  <text x="258" y="314" font-family="'Segoe UI',ui-sans-serif,sans-serif" font-size="14" letter-spacing="2" fill="#6f7a8c">A RECOLLECTION ENGINE FOR AI ROLEPLAY</text>
